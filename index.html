<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadows">
<title>Shadows CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#08080A;color:#F7F5F5}#boot{position:fixed;inset:0;background:#08080A;display:grid;place-items:center;z-index:99}</style>
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
<div id="boot"><div class="bootin"><img src="assets/owl-head.webp" alt="" width="120" height="120"><div class="bootw">SHADOWS</div></div></div>

<main id="auth" hidden>
  <div class="authcard">
    <img class="authowl" src="assets/owl-head.webp" alt="" width="96" height="96">
    <img class="authword" src="assets/wordmark.webp" alt="Shadows" height="26">
    <p class="authtag" data-t="tag"></p>
    <div class="seg" id="authseg"><button data-m="in" class="on" data-t="auth.in"></button><button data-m="up" data-t="auth.up"></button></div>
    <form id="authform" novalidate>
      <label class="fld" id="fname" hidden><span data-t="auth.name"></span><input name="name" autocomplete="name"></label>
      <label class="fld"><span data-t="auth.email"></span><input name="email" type="email" autocomplete="email" dir="ltr" inputmode="email"></label>
      <label class="fld"><span data-t="auth.pw"></span><input name="password" type="password" autocomplete="current-password" dir="ltr"></label>
      <p class="hint" id="authhint" hidden data-t="auth.hint.up"></p>
      <p class="err" id="autherr" role="alert"></p>
      <button class="btn big" id="authgo" type="submit"></button>
      <button class="btn ghost" id="demobtn" type="button" hidden data-t="auth.demo"></button>
    </form>
    <button class="lang" id="authlang" type="button"></button>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="topl"><img src="assets/owl-head.webp" alt="" width="30" height="30"><span id="title"></span></div>
    <button class="lang" id="applang" type="button"></button>
  </header>
  <div id="demobar" class="demobar" hidden></div>
  <section id="stage" aria-live="polite"></section>
  <div id="cands" aria-hidden="true"></div>
  <div id="dialcap" aria-live="polite"></div>
  <div class="dialwrap"><div id="dial" role="slider" tabindex="0" aria-label="Navigation"></div><div class="dialhint" id="dialhint"></div></div>
</div>

<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetin"></div></div>
<div id="toast" role="status"></div>

<script src="js/config.js?v=1"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/store.js?v=1"></script>
<script src="js/dial.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
