<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadows">
<title>Shadows CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#08080A;color:#F7F5F5}#boot{position:fixed;inset:0;background:#08080A;display:grid;place-items:center;z-index:99}</style>
<link rel="stylesheet" href="css/app.css?v=16">
</head>
<body>
<div id="boot"><div class="bootin"><img class="wings" src="assets/owl-wings.webp" alt="" width="320" height="180"><img src="assets/wordmark.webp" alt="Shadows" height="30" style="display:block;margin:6px auto 0"><div class="bootw">WE MOVE IN SILENCE.</div></div></div>

<main id="auth" hidden>
  <div class="authcard">
    <img class="authwings" src="assets/owl-wings.webp" alt="" width="320" height="180">
    <img class="authword" src="assets/wordmark.webp" alt="Shadows" height="26">
    <p class="authtag">WE MOVE IN SILENCE.</p>
    <div class="seg" id="authseg"><button data-m="in" class="on" data-t="auth.in"></button><button data-m="up" data-t="auth.up"></button></div>
    <form id="authform" novalidate>
      <label class="fld" id="fname" hidden><span data-t="auth.name"></span><input name="name" autocomplete="name"></label>
      <label class="fld"><span data-t="auth.email"></span><input name="email" type="email" autocomplete="email" dir="ltr" inputmode="email"></label>
      <label class="fld"><span data-t="auth.pw"></span><input name="password" type="password" autocomplete="current-password" dir="ltr"></label>
      <p class="hint" id="authhint" hidden data-t="auth.hint.up"></p>
      <p class="err" id="autherr" role="alert"></p>
      <button class="btn big" id="authgo" type="submit"></button>
      <button class="btn ghost" id="demobtn" type="button" hidden data-t="auth.demo"></button>
    </form>
    <button class="lang" id="authlang" type="button"></button><div class="foot">SHADOWS | MEDIA &amp; ADVERTISING</div>
  </div>
</main>

<div id="app" hidden>
  <div id="hubbg" aria-hidden="true"><img id="owl" src="assets/owl-v16.webp" alt="" width="3096" height="2190"><i class="hx"></i><i class="hy"></i></div>
  <div id="intro"><div id="introbrand">WE MOVE IN SILENCE.</div><div id="introhint"></div></div>
  <button id="burger" type="button" aria-label="Menu"><span></span><span></span><span></span><em id="burgerdot" hidden></em></button>
  <button id="addb" type="button" aria-label="+" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <section id="stage" aria-live="polite"></section>
  <div id="cands" aria-hidden="true"></div>
  <div id="dialcap" aria-live="polite"></div>
  <div class="dialwrap"><div id="dial" role="slider" tabindex="0" aria-label="Navigation"></div><div class="dialhint" id="dialhint"></div></div>
  <div id="menubg"></div>
  <nav id="menu" aria-hidden="true">
    <div class="menuhead"><img src="assets/wordmark.webp" alt="Shadows" height="22"><button id="menuclose" type="button" aria-label="Close">&times;</button></div>
    <div id="menulist"></div>
    <div class="menufoot">
      <button class="menuitem" id="bell" type="button"><span class="mi" id="bellt"></span><i id="belln" hidden></i></button>
      <div class="acts"><button class="lang" id="applang" type="button"></button><button class="lang" id="mout2" type="button"></button></div>
      <div id="demobar" class="demobar" hidden></div>
      <div class="foot">SHADOWS | WE MOVE IN SILENCE.</div>
    </div>
  </nav>
</div>

<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetin"></div></div>
<div id="toast" role="status"></div>

<script src="js/config.js?v=16"></script>
<script src="js/i18n.js?v=16"></script>
<script src="js/store.js?v=16"></script>
<script src="js/dial.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
