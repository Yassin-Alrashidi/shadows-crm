<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shadows | انضم للفريق</title>
<link rel="icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('crm.theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{--bg:#fff;--fg:#17161A;--mut:#6F6A72;--ln:#E4E0E2;--red:#E11827;--pk:#FDE7E9}
html[data-theme=dark]{--bg:#0E0E10;--fg:#F2F0F1;--mut:#9A959C;--ln:#2A292E;--pk:#2C1015;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Cairo',system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 48px}
.eye{width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 14px}
.brand{text-align:center;font:800 13px 'Cairo';letter-spacing:.32em;color:var(--mut);margin-bottom:22px}
h1{font:800 26px/1.3 'Cairo';margin:0 0 6px;text-align:center}
.lead{color:var(--mut);text-align:center;margin:0 0 24px;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;margin:0 0 14px;font-weight:600;font-size:14px}
label small{color:var(--mut);font-weight:400}
input{width:100%;height:50px;margin-top:6px;padding:0 14px;font:400 16px 'Cairo',sans-serif;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:14px;outline:0}
input:focus{border-color:var(--red)}
input.bad{border-color:var(--red);background:var(--pk)}
input.en{direction:ltr;text-align:left}
.pw{position:relative;display:block}.pw input{padding-inline-end:64px}
.pw button{position:absolute;inset-inline-end:6px;top:12px;height:38px;padding:0 12px;border:0;background:transparent;color:var(--mut);font:600 13px 'Cairo';cursor:pointer}
.e{color:var(--red);font-size:13px;min-height:0;margin:4px 0 0;font-weight:400}
.btn{width:100%;height:54px;border:0;border-radius:14px;background:var(--red);color:#fff;font:800 17px 'Cairo';cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.55}
.btn:active{transform:scale(.98)}
.ok{text-align:center;padding:40px 0}
.ok b{display:block;font:800 24px 'Cairo';margin-bottom:8px}
.ok p{color:var(--mut);margin:0}
.foot{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.2em;margin-top:30px}
.note{color:var(--mut);font-size:13px;margin:-6px 0 14px}
</style>
</head>
<body>
<main id="m">
<img class="eye" src="assets/eye.webp?v=32" alt="" width="72" height="72">
<div class="brand">SHADOWS</div>
<form id="f" novalidate>
<h1>انضم لفريق Shadows</h1>
<p class="lead">املأ بياناتك مرة واحدة. بتاخد دقيقة.</p>
<div class="g">
<label>الاسم الأول<input class="en" name="n1" autocomplete="given-name" dir="ltr" placeholder="Yassin"><p class="e"></p></label>
<label>الاسم الثاني<input class="en" name="n2" dir="ltr" placeholder="Ahmed"><p class="e"></p></label>
<label>الاسم الثالث<input class="en" name="n3" dir="ltr" placeholder="Mohamed"><p class="e"></p></label>
<label>اسم العيلة<input class="en" name="n4" autocomplete="family-name" dir="ltr" placeholder="Mostafa"><p class="e"></p></label>
</div>
<p class="note">الاسم بالإنجليزي، حروف إنجليزية فقط.</p>
<label>الدلع <small>(اختياري)</small><input name="nick" autocomplete="nickname" maxlength="30"></label>
<label>دورك في الشركة<input name="role" maxlength="60" placeholder="مثال: مصمم، مونتير، حسابات"><p class="e"></p></label>
<label>الإيميل<input class="en" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@example.com"><p class="e"></p></label>
<label>الباسورد اللي عايزه لإيميلك
<span class="pw"><input class="en" name="pw" type="password" autocomplete="new-password" dir="ltr"><button type="button" data-show>إظهار</button></span><p class="e"></p></label>
<label>أكّد الباسورد
<span class="pw"><input class="en" name="pw2" type="password" autocomplete="new-password" dir="ltr"><button type="button" data-show>إظهار</button></span><p class="e"></p></label>
<p class="e" id="top"></p>
<button class="btn" id="go" type="submit">إرسال</button>
</form>
<div class="foot">WE MOVE IN SILENCE.</div>
</main>
<script src="js/config.js?v=32"></script>
<script>
(function(){
var f=document.getElementById('f'),$=function(n){return f.elements[n]};
var LAT=/^[A-Za-z]+(?:[ '\-][A-Za-z]+)*$/;
function err(n,m){var i=$(n);i.classList.toggle('bad',!!m);var p=i.closest('label').querySelector('.e');if(p)p.textContent=m||''}
document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'إخفاء':'إظهار'}});
['n1','n2','n3','n4'].forEach(function(n){$(n).addEventListener('input',function(){$(n).value=$(n).value.replace(/[^A-Za-z '\-]/g,'');err(n,'')})});
['role','email','pw','pw2'].forEach(function(n){$(n).addEventListener('input',function(){err(n,'')})});
function check(){
  var ok=true,v=function(n){return $(n).value.trim()};
  ['n1','n2','n3','n4'].forEach(function(n){if(!v(n)){err(n,'مطلوب');ok=false}else if(!LAT.test(v(n))){err(n,'حروف إنجليزية فقط');ok=false}});
  if(!v('role')){err('role','مطلوب');ok=false}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))){err('email','إيميل غير صحيح');ok=false}
  var p=$('pw').value;
  if(p.length<8){err('pw','٨ حروف على الأقل');ok=false}
  if($('pw2').value!==p){err('pw2','الباسورد مش متطابق');ok=false}
  return ok}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()}
f.addEventListener('submit',async function(e){
  e.preventDefault();if(!check())return;
  var v=function(n){return $(n).value.trim()};
  var name=['n1','n2','n3','n4'].map(function(n){return cap(v(n))}).join(' ');
  var meta={name:name,nickname:v('nick')||null,job_title:v('role')};
  var email=v('email').toLowerCase(),go=document.getElementById('go');go.disabled=true;go.textContent='...';
  var top=document.getElementById('top');top.textContent='';
  try{
    var C=window.CRM_CONFIG||{};
    if(C.supabaseUrl&&C.supabaseKey){
      /* live: the password goes only to Supabase Auth (stored hashed). It never touches a table. */
      var r=await fetch(C.supabaseUrl.replace(/\/$/,'')+'/auth/v1/signup',{method:'POST',headers:{'apikey':C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:$('pw').value,data:meta})});
      var j=await r.json().catch(function(){return{}});
      if(!r.ok){var m=(j.msg||j.message||j.error_description||'')+'';throw new Error(/not invited/i.test(m)?'invite':/registered|exists/i.test(m)?'exists':'fail')}
    }else{
      /* demo: saved on this device only, and WITHOUT the password */
      var L=JSON.parse(localStorage.getItem('crm.join')||'[]');L.push({email:email,name:name,nickname:meta.nickname,job_title:meta.job_title,at:new Date().toISOString()});localStorage.setItem('crm.join',JSON.stringify(L));
    }
    document.getElementById('m').innerHTML='<img class="eye" src="assets/eye.webp?v=32" alt="" width="72" height="72"><div class="ok"><b>تمام يا '+(meta.nickname||v('n1')).replace(/[<>&"]/g,'')+'</b><p>'+(C.supabaseUrl?'افتح إيميلك وأكّد الحساب، وبعدها تقدر تدخل.':'تم الحفظ. هنتواصل معاك.')+'</p></div><div class="foot">WE MOVE IN SILENCE.</div>';
  }catch(x){
    top.textContent=x.message==='invite'?'الإيميل ده مش مدعو. كلّم ياسين.':x.message==='exists'?'الإيميل ده مسجّل قبل كده.':'حصلت مشكلة. جرّب تاني.';
    go.disabled=false;go.textContent='إرسال'}
});
})();
</script>
</body>
</html>
