<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050507">
<title>Shadows | Team Onboarding</title>
<link rel="icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--card:#0D0A0D;--fg:#F6F2F3;--mut:#9A9096;--ln:#2B2227;--red:#E11827;--red2:#910814}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Cairo',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;background:url(assets/grain.png);opacity:.07;pointer-events:none;z-index:5}
.hero{position:relative;max-width:560px;margin:0 auto;aspect-ratio:1072/572;overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 55%}
.hero .glow{position:absolute;left:50%;top:44%;width:92%;aspect-ratio:1;margin:-46% 0 0 -46%;background:radial-gradient(closest-side,rgba(225,24,39,.55),rgba(225,24,39,.16) 55%,rgba(225,24,39,0) 100%);mix-blend-mode:normal;pointer-events:none}
.hero .eye{position:absolute;top:60.5%;width:9%;aspect-ratio:1;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,70,80,.95),rgba(255,40,55,.35) 55%,rgba(255,40,55,0) 100%);pointer-events:none}
.hero .eye.l{left:43.6%}.hero .eye.r{left:55.9%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 0,rgba(5,5,7,0) 12%,rgba(5,5,7,0) 96%,var(--bg) 100%),linear-gradient(to right,var(--bg) 0,rgba(5,5,7,0) 18%,rgba(5,5,7,0) 82%,var(--bg) 100%),radial-gradient(ellipse at 50% 46%,rgba(5,5,7,0) 40%,rgba(5,5,7,.65) 100%)}
.em{position:absolute;bottom:8%;width:3px;height:3px;border-radius:50%;background:#FF4655;opacity:0;pointer-events:none}
main{position:relative;z-index:2;max-width:480px;margin:-6px auto 0;padding:0 20px calc(env(safe-area-inset-bottom) + 48px)}
.kick{margin-top:6px!important;display:flex;align-items:center;justify-content:center;gap:12px;font:800 11px 'Cairo';letter-spacing:.42em;color:var(--red);margin:0 0 4px;text-indent:.42em}
.kick:before,.kick:after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--red))}
.kick:after{transform:scaleX(-1)}
h1{font:900 44px/1.05 'Cairo';margin:0 0 10px;text-align:center;letter-spacing:.015em;text-transform:uppercase;text-shadow:0 0 34px rgba(225,24,39,.55)}
h1 span{display:block;font:700 13px 'Cairo';letter-spacing:.6em;text-indent:.6em;color:var(--red);text-shadow:none;margin-top:4px}
.lead{color:var(--mut);text-align:center;margin:0 0 28px;font-size:14.5px}
.card{background:linear-gradient(180deg,#130E12,var(--card) 120px);border:1px solid var(--ln);border-radius:24px;padding:26px 18px 20px;position:relative;box-shadow:0 30px 70px -26px rgba(225,24,39,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.card:before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--red) 30%,#FF4655 50%,var(--red) 70%,transparent)}
label{display:block;margin:0 0 20px;font-weight:600;font-size:14.5px;color:var(--fg);transition:color .2s}
label small{color:var(--mut);font-weight:400}
label small.hint{display:block;margin:8px 2px 0;font-size:12.5px;line-height:1.5}
.n{display:inline-block;min-width:30px;font:900 12px 'Cairo';letter-spacing:.14em;color:var(--red);vertical-align:1px;transition:text-shadow .2s}
label:focus-within .n{text-shadow:0 0 12px rgba(255,70,85,.9)}
input{width:100%;height:56px;margin-top:9px;padding:0 16px;font:400 16px 'Cairo',sans-serif;color:var(--fg);background:#080609;border:1px solid var(--ln);border-radius:15px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,24,39,.18),0 10px 26px -12px rgba(225,24,39,.7)}
input.bad{border-color:var(--red);background:#1B0C10}
input.en{direction:ltr;text-align:left}
.pw{position:relative;display:block}.pw input{padding-right:76px!important}
.pw button{position:absolute;right:6px;top:16px;height:40px;padding:0 14px;border:0;background:transparent;color:var(--mut);font:600 13px 'Cairo';cursor:pointer}
.e{color:#FF5A66;font-size:13px;margin:5px 2px 0;font-weight:400;direction:ltr;text-align:left}.e:empty{display:none}
.btn{position:relative;overflow:hidden;width:100%;height:60px;border:0;border-radius:16px;background:linear-gradient(180deg,#F0283A,#B80F1D);color:#fff;font:900 16px 'Cairo';letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;cursor:pointer;margin-top:10px;box-shadow:0 16px 36px -12px rgba(225,24,39,.95),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s}
.btn:disabled{opacity:.65}
.btn:active{transform:scale(.97)}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));transform:translateX(0) skewX(-18deg);opacity:0}
.ok{text-align:center;padding:34px 0 30px}
.ok b{display:block;font:900 30px/1.2 'Cairo';text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;text-shadow:0 0 30px rgba(225,24,39,.6)}
.ok p{color:var(--mut);margin:0 0 18px}
.ok em{display:block;font:800 11px 'Cairo';font-style:normal;letter-spacing:.42em;text-indent:.42em;color:var(--red)}
.ring{position:relative;width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(180deg,#F0283A,#B80F1D);display:grid;place-items:center;box-shadow:0 0 44px rgba(225,24,39,.7)}
.ring svg{width:44px;height:44px}
.ring i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0}
.foot{text-align:center;color:var(--mut);font-size:11px;letter-spacing:.3em;margin-top:32px;text-indent:.3em}
.foot b{display:block;color:var(--red);font-weight:600;letter-spacing:.38em;margin-bottom:6px;opacity:.85}
body.done .hero .glow{opacity:1}
@media (prefers-reduced-motion:no-preference){
 .hero img{animation:kb 18s ease-in-out infinite alternate}
 .hero .glow{animation:br 5s ease-in-out infinite}
 .hero .eye{animation:ey 3.6s ease-in-out infinite}.hero .eye.r{animation-delay:.12s}
 .em{animation:fl 6s linear infinite}
 .em:nth-of-type(1){left:22%;animation-delay:0s}.em:nth-of-type(2){left:38%;animation-delay:1.4s}.em:nth-of-type(3){left:61%;animation-delay:2.6s}.em:nth-of-type(4){left:77%;animation-delay:.8s}.em:nth-of-type(5){left:50%;animation-delay:3.8s}.em:nth-of-type(6){left:30%;animation-delay:4.7s}
 main>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
 main>*:nth-child(2){animation-delay:.1s}main>*:nth-child(3){animation-delay:.2s}main>*:nth-child(4){animation-delay:.3s}main>*:nth-child(5){animation-delay:.42s}
 .btn:after{animation:sh 3.8s ease-in-out 1.2s infinite}
 .ring{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
 .ring i{animation:pulse 2s ease-out infinite}.ring i:nth-child(2){animation-delay:1s}
 .ok b,.ok p,.ok em{animation:up .7s cubic-bezier(.2,.7,.2,1) both}.ok b{animation-delay:.25s}.ok p{animation-delay:.4s}.ok em{animation-delay:.6s}
}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes br{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ey{0%,100%{opacity:.35}45%{opacity:1}55%{opacity:.9}}
@keyframes fl{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(14px,-150px)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sh{0%{transform:translateX(0) skewX(-18deg);opacity:0}8%{opacity:1}30%,100%{transform:translateX(480%) skewX(-18deg);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
</style>
</head>
<body>
<div class="hero"><img src="assets/join-hero.webp?v=43" alt="Shadows" width="1072" height="572" fetchpriority="high"><div class="glow"></div><i class="eye l"></i><i class="eye r"></i><i class="em"></i><i class="em"></i><i class="em"></i><i class="em"></i><i class="em"></i><i class="em"></i></div>
<main id="m">
<p class="kick">TEAM ONBOARDING</p>
<h1>Welcome<span>TO SHADOWS</span></h1>
<p class="lead">WE MOVE IN SILENCE. Fill this in once. Takes a minute.</p>
<div class="card" id="fw">
<form id="f" novalidate>
<label><span class="n">01</span>Your Name<input class="en" name="name" enterkeyhint="next" autocomplete="name" dir="ltr"><p class="e"></p></label>
<label><span class="n">02</span>If u had a nickname <small>(optional)</small><input name="nick" enterkeyhint="next" autocomplete="nickname" maxlength="30"></label>
<label><span class="n">03</span>What's your role in the company?<input class="en" name="role" enterkeyhint="next" maxlength="60" dir="ltr"><p class="e"></p></label>
<label dir="rtl"><span class="n">04</span>الباسورد اللي تحب يكون لإيميلك في الشركة
<span class="pw"><input class="en" name="pw" enterkeyhint="done" type="password" autocomplete="new-password" dir="ltr"><button type="button" data-show>إظهار</button></span><small class="hint" dir="rtl">اكتب باسورد جديد خاص بالشغل، مش واحد بتستخدمه في مكان تاني.</small><p class="e"></p></label>
<p class="e" id="top"></p>
<button class="btn" id="go" type="submit">Submit</button>
</form>
</div>
<div class="foot"><b>WE MOVE IN SILENCE.</b>SHADOWS | MEDIA &amp; ADVERTISING</div>
</main>
<script src="js/join-config.js?v=43"></script>
<script>
(function(){
var f=document.getElementById('f'),$=function(n){return f.elements[n]};
function err(n,m){var i=$(n);i.classList.toggle('bad',!!m);var p=i.closest('label').querySelector('.e');if(p)p.textContent=m||''}
document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'إخفاء':'إظهار'}});
['name','role','pw'].forEach(function(n){$(n).addEventListener('input',function(){err(n,'')})});
function check(){
  var ok=true,v=function(n){return $(n).value.trim()};
  if(v('name').length<5){err('name','Required (5 characters or more)');ok=false}
  if(!v('role')){err('role','Required');ok=false}
  var p=$('pw').value;
  if(p.length<8||p.length>64){err('pw','8 to 64 characters');ok=false}
  return ok}
f.addEventListener('submit',async function(e){
  e.preventDefault();if(!check())return;
  var v=function(n){return $(n).value.trim()};
  var name=v('name').replace(/\s+/g,' ');
  var meta={name:name,nickname:v('nick')||null,job_title:v('role')};
  var go=document.getElementById('go');go.disabled=true;go.textContent='Sending';
  var top=document.getElementById('top');top.textContent='';
  try{
    var C=window.JOIN_CONFIG||{};
    if(!(C.supabaseUrl&&C.supabaseKey)){ if(location.search.indexOf('preview')<0) throw new Error('closed'); }
    else{
      var base=C.supabaseUrl.replace(/\/$/,''),H={'apikey':C.supabaseKey,'Authorization':'Bearer '+C.supabaseKey,'Content-Type':'application/json'};
      var kr=await fetch(base+'/rest/v1/rpc/join_pubkey',{method:'POST',headers:H,body:'{}'});var pk=await kr.json();
      if(!kr.ok||!pk) throw new Error('closed');
      /* the password is encrypted here, in the browser, with a public key. Only Yassin's private key can open it. */
      var key=await crypto.subtle.importKey('spki',Uint8Array.from(atob(pk),function(c){return c.charCodeAt(0)}),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
      var ct=await crypto.subtle.encrypt({name:'RSA-OAEP'},key,new TextEncoder().encode($('pw').value));
      var enc=btoa(String.fromCharCode.apply(null,new Uint8Array(ct)));
      var r=await fetch(base+'/rest/v1/join_responses',{method:'POST',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify({full_name:name,nickname:meta.nickname,job_title:meta.job_title,enc_password:enc})});
      if(!r.ok) throw new Error('fail');
    }
    document.getElementById('fw').innerHTML='<div class="ok"><div class="ring"><i></i><i></i><svg viewBox="0 0 52 52" width="64" height="64"><path d="M14 27l8 8 16-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><b>Welcome, '+(meta.nickname||name.split(' ')[0]).replace(/[<>&"]/g,'')+'</b><p>Received. Thank you.</p></div>';document.body.classList.add('done');window.scrollTo(0,0);
  }catch(x){
    top.textContent=x.message==='closed'?'The form is not open yet. Try again later.':'Something went wrong. Try again.';
    go.disabled=false;go.textContent='Submit'}
});
})();
</script>
</body>
</html>
