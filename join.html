<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080A">
<title>Shadows | Team Onboarding</title>
<link rel="icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080A;--card:#100D10;--fg:#F4F1F2;--mut:#988F95;--ln:#2A2328;--red:#E11827;--red2:#910814}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Cairo',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.hero{position:relative;max-width:560px;margin:0 auto;aspect-ratio:1072/572}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 0,rgba(8,8,10,0) 14%,rgba(8,8,10,0) 93%,var(--bg) 100%),linear-gradient(to right,var(--bg) 0,rgba(8,8,10,0) 14%,rgba(8,8,10,0) 86%,var(--bg) 100%)}
main{position:relative;max-width:480px;margin:10px auto 0;padding:0 20px calc(env(safe-area-inset-bottom) + 44px)}
.kick{text-align:center;font:800 11px 'Cairo';letter-spacing:.38em;color:var(--red);margin:0 0 6px;text-indent:.38em}
h1{font:800 28px/1.25 'Cairo';margin:0 0 8px;text-align:center;letter-spacing:.01em}
.lead{color:var(--mut);text-align:center;margin:0 0 26px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:22px 18px 20px;position:relative;box-shadow:0 20px 50px -24px rgba(225,24,39,.35)}
.card:before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
label{display:block;margin:0 0 18px;font-weight:600;font-size:14px;color:var(--fg)}
label small{color:var(--mut);font-weight:400}
label small.hint{display:block;margin:7px 2px 0;font-size:12.5px;line-height:1.5}
.n{display:inline-block;min-width:26px;font:800 11px 'Cairo';letter-spacing:.14em;color:var(--red);vertical-align:1px}
input{width:100%;height:54px;margin-top:8px;padding:0 16px;font:400 16px 'Cairo',sans-serif;color:var(--fg);background:#0A080B;border:1px solid var(--ln);border-radius:14px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,24,39,.16)}
input.bad{border-color:var(--red);background:#1A0D10}
input.en{direction:ltr;text-align:left}
.pw{position:relative;display:block}.pw input{padding-right:76px!important}
.pw button{position:absolute;right:6px;top:15px;height:40px;padding:0 14px;border:0;background:transparent;color:var(--mut);font:600 13px 'Cairo';cursor:pointer}
.e{color:#FF5A66;font-size:13px;margin:5px 2px 0;font-weight:400}.e:empty{display:none}.e{direction:ltr;text-align:left}
.btn{width:100%;height:56px;border:0;border-radius:15px;background:linear-gradient(180deg,#EC2432,#C4111F);color:#fff;font:800 16px 'Cairo';letter-spacing:.08em;cursor:pointer;margin-top:8px;box-shadow:0 12px 28px -12px rgba(225,24,39,.8);transition:transform .15s}
.btn:disabled{opacity:.6}
.btn:active{transform:scale(.98)}
.ok{text-align:center;padding:34px 0 30px}
.ok b{display:block;font:800 24px 'Cairo';margin-bottom:6px}
.ok p{color:var(--mut);margin:0}
.tick{display:block;width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--red);position:relative}
.tick:after{content:"";position:absolute;left:21px;top:13px;width:14px;height:26px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(45deg)}
.foot{text-align:center;color:var(--mut);font-size:11px;letter-spacing:.3em;margin-top:30px;text-indent:.3em}
.foot b{display:block;color:var(--red);font-weight:600;letter-spacing:.38em;margin-bottom:6px;opacity:.85}
@media (prefers-reduced-motion:no-preference){
 .hero img{animation:hz 1.4s cubic-bezier(.2,.7,.2,1) both}
 main>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
 main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}main>*:nth-child(4){animation-delay:.24s}main>*:nth-child(5){animation-delay:.32s}
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hz{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="hero"><img src="assets/join-hero.webp?v=42" alt="Shadows" width="1072" height="572" fetchpriority="high"></div>
<main id="m">
<p class="kick">TEAM ONBOARDING</p>
<h1>Welcome to Shadows</h1>
<p class="lead">WE MOVE IN SILENCE. Fill this in once. Takes a minute.</p>
<div class="card" id="fw">
<form id="f" novalidate>
<label><span class="n">01</span>Your Name<input class="en" name="name" autocomplete="name" dir="ltr"><p class="e"></p></label>
<label><span class="n">02</span>If u had a nickname <small>(optional)</small><input name="nick" autocomplete="nickname" maxlength="30"></label>
<label><span class="n">03</span>What's your role in the company?<input class="en" name="role" maxlength="60" dir="ltr"><p class="e"></p></label>
<label dir="rtl"><span class="n">04</span>الباسورد اللي تحب يكون لإيميلك في الشركة
<span class="pw"><input class="en" name="pw" type="password" autocomplete="new-password" dir="ltr"><button type="button" data-show>إظهار</button></span><small class="hint" dir="rtl">اكتب باسورد جديد خاص بالشغل، مش واحد بتستخدمه في مكان تاني.</small><p class="e"></p></label>
<p class="e" id="top"></p>
<button class="btn" id="go" type="submit">Submit</button>
</form>
</div>
<div class="foot"><b>WE MOVE IN SILENCE.</b>SHADOWS | MEDIA &amp; ADVERTISING</div>
</main>
<script src="js/join-config.js?v=40"></script>
<script>
(function(){
var f=document.getElementById('f'),$=function(n){return f.elements[n]};
function err(n,m){var i=$(n);i.classList.toggle('bad',!!m);var p=i.closest('label').querySelector('.e');if(p)p.textContent=m||''}
document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'إخفاء':'إظهار'}});
['name','role','pw'].forEach(function(n){$(n).addEventListener('input',function(){err(n,'')})});
function check(){
  var ok=true,v=function(n){return $(n).value.trim()};
  if(v('name').length<5){err('name','Required (5 characters or more)');ok=false}
  if(!v('role')){err('role','Required');ok=false}
  var p=$('pw').value;
  if(p.length<8||p.length>64){err('pw','8 to 64 characters');ok=false}
  return ok}
f.addEventListener('submit',async function(e){
  e.preventDefault();if(!check())return;
  var v=function(n){return $(n).value.trim()};
  var name=v('name').replace(/\s+/g,' ');
  var meta={name:name,nickname:v('nick')||null,job_title:v('role')};
  var go=document.getElementById('go');go.disabled=true;go.textContent='...';
  var top=document.getElementById('top');top.textContent='';
  try{
    var C=window.JOIN_CONFIG||{};
    if(!(C.supabaseUrl&&C.supabaseKey)){ if(location.search.indexOf('preview')<0) throw new Error('closed'); }
    else{
      var base=C.supabaseUrl.replace(/\/$/,''),H={'apikey':C.supabaseKey,'Authorization':'Bearer '+C.supabaseKey,'Content-Type':'application/json'};
      var kr=await fetch(base+'/rest/v1/rpc/join_pubkey',{method:'POST',headers:H,body:'{}'});var pk=await kr.json();
      if(!kr.ok||!pk) throw new Error('closed');
      /* the password is encrypted here, in the browser, with a public key. Only Yassin's private key can open it. */
      var key=await crypto.subtle.importKey('spki',Uint8Array.from(atob(pk),function(c){return c.charCodeAt(0)}),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
      var ct=await crypto.subtle.encrypt({name:'RSA-OAEP'},key,new TextEncoder().encode($('pw').value));
      var enc=btoa(String.fromCharCode.apply(null,new Uint8Array(ct)));
      var r=await fetch(base+'/rest/v1/join_responses',{method:'POST',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify({full_name:name,nickname:meta.nickname,job_title:meta.job_title,enc_password:enc})});
      if(!r.ok) throw new Error('fail');
    }
    document.getElementById('fw').innerHTML='<div class="ok"><i class="tick"></i><b>Welcome, '+(meta.nickname||name.split(' ')[0]).replace(/[<>&"]/g,'')+'</b><p>Received. Thank you.</p></div>';window.scrollTo(0,0);
  }catch(x){
    top.textContent=x.message==='closed'?'The form is not open yet. Try again later.':'Something went wrong. Try again.';
    go.disabled=false;go.textContent='Submit'}
});
})();
</script>
</body>
</html>
