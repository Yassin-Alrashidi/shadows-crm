<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shadows | Team Onboarding</title>
<link rel="icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme='dark'</script>
<style>
:root{--bg:#fff;--fg:#17161A;--mut:#6F6A72;--ln:#E4E0E2;--red:#E11827;--pk:#FDE7E9}
html[data-theme=dark]{--bg:#08080A;--fg:#F2F0F1;--mut:#9A959C;--ln:#2A292E;--pk:#2C1015;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Cairo',system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 48px}
.hero{width:100%;height:auto;border-radius:16px;display:block;margin:0 0 22px}
.eye{width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 14px}
.brand{text-align:center;font:800 13px 'Cairo';letter-spacing:.32em;color:var(--mut);margin-bottom:22px}
h1{font:800 26px/1.3 'Cairo';margin:0 0 6px;text-align:center}
.lead{color:var(--mut);text-align:center;margin:0 0 24px;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;margin:0 0 14px;font-weight:600;font-size:14px}
label small{color:var(--mut);font-weight:400}
input{width:100%;height:50px;margin-top:6px;padding:0 14px;font:400 16px 'Cairo',sans-serif;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:14px;outline:0}
input:focus{border-color:var(--red)}
input.bad{border-color:var(--red);background:var(--pk)}
input.en{direction:ltr;text-align:left}
.pw{position:relative;display:block}.pw input{padding-right:70px!important}
.pw button{position:absolute;right:6px;top:12px;height:38px;padding:0 12px;border:0;background:transparent;color:var(--mut);font:600 13px 'Cairo';cursor:pointer}
.e{color:var(--red);font-size:13px;min-height:0;margin:4px 0 0;font-weight:400}
.btn{width:100%;height:54px;border:0;border-radius:14px;background:var(--red);color:#fff;font:800 17px 'Cairo';cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.55}
.btn:active{transform:scale(.98)}
.ok{text-align:center;padding:40px 0}
.ok b{display:block;font:800 24px 'Cairo';margin-bottom:8px}
.ok p{color:var(--mut);margin:0}
.foot{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.2em;margin-top:30px}
.note{color:var(--mut);font-size:13px;margin:-6px 0 14px}
</style>
</head>
<body>
<main id="m">
<img class="hero" src="assets/join-header.webp?v=35" alt="Shadows" width="1600" height="400">
<form id="f" novalidate>
<h1>Welcome to Shadows</h1>
<p class="lead">WE MOVE IN SILENCE. Fill this in once. Takes a minute.</p>
<label>Your Name<input class="en" name="name" autocomplete="name" dir="ltr"><p class="e"></p></label>
<label>If u had a nickname <small>(optional)</small><input name="nick" autocomplete="nickname" maxlength="30"></label>
<label>What's your role in the company?<input class="en" name="role" maxlength="60" dir="ltr"><p class="e"></p></label>
<label dir="rtl">الباسورد اللي تحب يكون لإيميلك في الشركة
<span class="pw"><input class="en" name="pw" type="password" autocomplete="new-password" dir="ltr"><button type="button" data-show>إظهار</button></span><p class="e"></p></label>
<p class="e" id="top"></p>
<button class="btn" id="go" type="submit">Submit</button>
</form>
<div class="foot">SHADOWS | MEDIA &amp; ADVERTISING</div>
</main>
<script src="js/join-config.js?v=36"></script>
<script>
(function(){
var f=document.getElementById('f'),$=function(n){return f.elements[n]};
function err(n,m){var i=$(n);i.classList.toggle('bad',!!m);var p=i.closest('label').querySelector('.e');if(p)p.textContent=m||''}
document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'إخفاء':'إظهار'}});
['name','role','pw'].forEach(function(n){$(n).addEventListener('input',function(){err(n,'')})});
function check(){
  var ok=true,v=function(n){return $(n).value.trim()};
  if(v('name').length<3){err('name','Required');ok=false}
  if(!v('role')){err('role','Required');ok=false}
  var p=$('pw').value;
  if(p.length<8||p.length>64){err('pw','8 to 64 characters');ok=false}
  return ok}
f.addEventListener('submit',async function(e){
  e.preventDefault();if(!check())return;
  var v=function(n){return $(n).value.trim()};
  var name=v('name').replace(/\s+/g,' ');
  var meta={name:name,nickname:v('nick')||null,job_title:v('role')};
  var go=document.getElementById('go');go.disabled=true;go.textContent='...';
  var top=document.getElementById('top');top.textContent='';
  try{
    var C=window.JOIN_CONFIG||{};
    if(!(C.supabaseUrl&&C.supabaseKey)){ if(location.search.indexOf('preview')<0) throw new Error('closed'); }
    else{
      var base=C.supabaseUrl.replace(/\/$/,''),H={'apikey':C.supabaseKey,'Authorization':'Bearer '+C.supabaseKey,'Content-Type':'application/json'};
      var kr=await fetch(base+'/rest/v1/rpc/join_pubkey',{method:'POST',headers:H,body:'{}'});var pk=await kr.json();
      if(!kr.ok||!pk) throw new Error('closed');
      /* the password is encrypted here, in the browser, with a public key. Only Yassin's private key can open it. */
      var key=await crypto.subtle.importKey('spki',Uint8Array.from(atob(pk),function(c){return c.charCodeAt(0)}),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
      var ct=await crypto.subtle.encrypt({name:'RSA-OAEP'},key,new TextEncoder().encode($('pw').value));
      var enc=btoa(String.fromCharCode.apply(null,new Uint8Array(ct)));
      var r=await fetch(base+'/rest/v1/join_responses',{method:'POST',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify({full_name:name,nickname:meta.nickname,job_title:meta.job_title,enc_password:enc})});
      if(!r.ok) throw new Error('fail');
    }
    document.getElementById('m').innerHTML='<img class="eye" src="assets/eye.webp?v=35" alt="" width="72" height="72"><div class="ok"><b>Welcome, '+(meta.nickname||name.split(' ')[0]).replace(/[<>&"]/g,'')+'</b><p>Received. Thank you.</p></div><div class="foot">WE MOVE IN SILENCE.</div>';
  }catch(x){
    top.textContent=x.message==='closed'?'The form is not open yet. Try again later.':'Something went wrong. Try again.';
    go.disabled=false;go.textContent='Submit'}
});
})();
</script>
</body>
</html>
